spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/uni_ai_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  grpc:
    client:
      rag-engine:
        address: 'static://127.0.0.1:50051'
        negotiation-type: plaintext